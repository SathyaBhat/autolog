services:
  autolog:
    build: .
    container_name: autolog
    restart: unless-stopped
    env_file:
      - path: .env
    environment:
      - STORE_PATH=/data/autolog.db
      # Enables the phone event API and the read-only MCP endpoint at /mcp.
      - HTTP_ADDR=:8080
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.autolog.rule=Host(`wraeclast.bishop-bass.ts.net`) && PathPrefix(`/autolog`)"
      - "traefik.http.routers.autolog.entrypoints=web,websecure"
      - "traefik.http.routers.autolog.tls=true"
      - "traefik.http.routers.autolog.tls.certresolver=tailscale"
      - "traefik.http.routers.autolog.tls.domains[0].main=wraeclast.bishop-bass.ts.net"
      - "traefik.http.routers.autolog.middlewares=autolog-strip"
      - "traefik.http.middlewares.autolog-strip.stripprefix.prefixes=/autolog"
      - "traefik.http.services.autolog.loadbalancer.server.port=8080"
      - "traefik.http.routers.autolog-mcp.rule=Host(`wraeclast.bishop-bass.ts.net`) && PathPrefix(`/autolog/mcp`)"
      - "traefik.http.routers.autolog-mcp.priority=100"
      - "traefik.http.routers.autolog-mcp.entrypoints=web,websecure"
      - "traefik.http.routers.autolog-mcp.tls=true"
      - "traefik.http.routers.autolog-mcp.tls.certresolver=tailscale"
      - "traefik.http.routers.autolog-mcp.middlewares=autolog-strip"
      - "traefik.http.routers.autolog-mcp.service=autolog"
    volumes:
      - autolog-data:/data
    networks:
      - dokploy-network

volumes:
  autolog-data:

networks:
  dokploy-network:
    external: true
